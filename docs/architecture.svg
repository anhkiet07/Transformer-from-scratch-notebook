<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Transformer architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- Top labels -->
  <text x="210" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Source sentences</text>
  <text x="690" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Target sentences</text>

  <line x1="210" y1="34" x2="210" y2="63" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="34" x2="690" y2="63" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SentenceEmbedding boxes -->
  <rect x="90" y="65" width="240" height="55" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="210" y="88" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">SentenceEmbedding</text>
  <text x="210" y="106" text-anchor="middle" font-size="11" fill="#475569">(embed + positional encoding)</text>

  <rect x="570" y="65" width="240" height="55" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="690" y="88" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">SentenceEmbedding</text>
  <text x="690" y="106" text-anchor="middle" font-size="11" fill="#475569">(embed + positional encoding)</text>

  <line x1="210" y1="120" x2="210" y2="149" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="120" x2="690" y2="149" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Encoder outer group -->
  <rect x="70" y="150" width="280" height="230" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="210" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">EncoderLayer &#215; N</text>

  <rect x="100" y="178" width="220" height="34" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="210" y="199" text-anchor="middle" font-size="12.5" fill="#1e3a8a">Self-Attention</text>
  <line x1="210" y1="212" x2="210" y2="225" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="100" y="226" width="220" height="34" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="210" y="247" text-anchor="middle" font-size="12.5" fill="#1e3a8a">Add &amp; Norm</text>
  <line x1="210" y1="260" x2="210" y2="273" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="100" y="274" width="220" height="34" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="210" y="295" text-anchor="middle" font-size="12.5" fill="#1e3a8a">Feed Forward</text>
  <line x1="210" y1="308" x2="210" y2="321" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="100" y="322" width="220" height="34" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="210" y="343" text-anchor="middle" font-size="12.5" fill="#1e3a8a">Add &amp; Norm</text>

  <!-- Decoder outer group -->
  <rect x="550" y="150" width="280" height="330" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="690" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">DecoderLayer &#215; N</text>

  <rect x="580" y="178" width="220" height="34" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="690" y="199" text-anchor="middle" font-size="12.5" fill="#4c1d95">Masked Self-Attention</text>
  <line x1="690" y1="212" x2="690" y2="225" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="580" y="226" width="220" height="34" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="690" y="247" text-anchor="middle" font-size="12.5" fill="#4c1d95">Add &amp; Norm</text>
  <line x1="690" y1="260" x2="690" y2="273" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="580" y="274" width="220" height="34" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="690" y="295" text-anchor="middle" font-size="12.5" fill="#4c1d95">Cross-Attention</text>
  <line x1="690" y1="308" x2="690" y2="321" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="580" y="322" width="220" height="34" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="690" y="343" text-anchor="middle" font-size="12.5" fill="#4c1d95">Add &amp; Norm</text>
  <line x1="690" y1="356" x2="690" y2="369" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="580" y="370" width="220" height="34" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="690" y="391" text-anchor="middle" font-size="12.5" fill="#4c1d95">Feed Forward</text>
  <line x1="690" y1="404" x2="690" y2="417" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="580" y="418" width="220" height="34" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="690" y="439" text-anchor="middle" font-size="12.5" fill="#4c1d95">Add &amp; Norm</text>

  <!-- encoder output -> cross-attention connector -->
  <path d="M350,265 L460,265 L460,291 L578,291" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="405" y="256" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">encoder output</text>

  <!-- decoder -> linear -> logits -->
  <line x1="690" y1="480" x2="690" y2="504" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="610" y="505" width="160" height="40" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="690" y="529" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">Linear (&#8594; vocab)</text>
  <line x1="690" y1="545" x2="690" y2="569" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="588" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">logits</text>
</svg>
